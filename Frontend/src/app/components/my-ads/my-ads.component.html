<div class="my-ads-page">
  <div class="page-header">
    <h2>My Ads</h2>
    <p>Manage all the posts you've created.</p>
  </div>
  
  @if (ads.length === 0) {
    <div class="empty-state">
      <p>You haven't posted any ads yet.</p>
    </div>
  } @else {
    <div class="board">
      @for (ad of ads; track ad.id) {
        <app-ad-card [ad]="ad" (edit)="openEditForm($event)" (delete)="deleteAd($event)"></app-ad-card>
      }
    </div>
  }
</div>

@if (showForm) {
  <app-ad-form [adToEdit]="selectedAd" (closeForm)="closeEditForm()"></app-ad-form>
}
